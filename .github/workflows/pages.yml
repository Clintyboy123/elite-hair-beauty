# GitHub Pages preview: https://clintyboy123.github.io/elite-hair-beauty/
#
# Builds only the frontend, served from /elite-hair-beauty/. There is no backend here, so:
#   - the forms show a "preview only" message (VITE_PREVIEW) instead of sending;
#   - the Shop reads a snapshot of the salon's WooCommerce products taken at build time (scripts/snapshot-shop.js),
#     and add-to-basket still goes to the real WooCommerce checkout.
# The real site is the Docker stack on the VPS (ci-cd.yml). The preview is marked noindex so it never competes
# with elitehair.co.za.
#
# One-time setting: Settings → Pages → Build and deployment → Source: "GitHub Actions".

name: Pages preview

on:
  push:
    branches: [main]
    paths:
      - frontend/**
      - backend/src/services/shop.service.js
      - scripts/snapshot-shop.js
      - .github/workflows/pages.yml
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install
        run: |
          npm ci --prefix frontend --no-audit --no-fund
          npm ci --prefix backend --no-audit --no-fund --omit=dev

      - name: Build for /elite-hair-beauty/
        run: npm run build --prefix frontend
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_PREVIEW: 'true'

      - name: Snapshot the shop's products
        run: node scripts/snapshot-shop.js frontend/dist/preview-data/shop

      # noindex keeps search engines on the real domain. 404.html lets deep links and refreshes
      # (e.g. /elite-hair-beauty/hair) load the app, which then shows the right page.
      - name: Prepare for Pages
        run: |
          cd frontend/dist
          sed -i 's#<head>#<head><meta name="robots" content="noindex, nofollow" />#' index.html
          cp index.html 404.html
          rm -f robots.txt sitemap.xml

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
